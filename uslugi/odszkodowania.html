<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Odszkodowania | Kancelaria Brunon Woźniak</title>

    <link rel="stylesheet" href="/css/tokens.css?v=20260822-44" />
    <link rel="stylesheet" href="/css/base.css?v=20260822-44" />
    <link rel="stylesheet" href="/css/layout.css?v=20260822-44" />
    <link rel="stylesheet" href="/css/components.css?v=20260822-44" />
</head>

<body>
    <div data-include="/partials/header.html"></div>

    <main>
        <section class="section section--hero">
            <div class="container services-page">
                <header class="services-page__header">
                    <h1 class="services-page__title">Odszkodowania</h1>
                    <p class="services-page__lead">Towarzystwa ubezpieczeniowe bardzo często zaniżają należne kwoty lub bezpodstawnie odmawiają wypłaty środków. Skutecznie reprezentujemy poszkodowanych, walcząc o pełne rekompensaty finansowe, które pozwolą na pokrycie strat i powrót do normalnego życia.</p>
                </header>


                <div class="service-cards" aria-label="Zakres usługi">
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Szkoda na osobie lub mieniu</span>
                            <span class="service-card__text">Pomagamy uzyskać pełne pokrycie kosztów związanych zarówno z uszczerbkiem na zdrowiu, jak i zniszczeniem Twojego prywatnego majątku.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Szkoda na osobie lub mieniu</h2>
                            <p class="service-modal__summary">Pomagamy uzyskać pełne pokrycie kosztów związanych zarówno z uszczerbkiem na zdrowiu, jak i zniszczeniem Twojego prywatnego majątku.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Dochodzenie zwrotu kosztów leczenia, rehabilitacji, zakupu leków oraz dostosowania mieszkania do potrzeb osoby niepełnosprawnej.</li>
                                <li>Walka o zwrot kosztów naprawy uszkodzonego mienia, maszyn, sprzętu elektronicznego czy budynków.</li>
                                <li>Reprezentacja w sprawach o renty wyrównawcze z tytułu utraty zdolności do pracy lub zwiększonych potrzeb życiowych.</li>
                                <li>Kompleksowe szacowanie realnej wartości poniesionych strat materialnych i utraconych korzyści finansowych (lucrum cessans).</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Sprawy przeciwko ubezpieczycielom</span>
                            <span class="service-card__text">Przełamujemy opór towarzystw ubezpieczeniowych, skutecznie podważając ich niesprawiedliwe decyzje odmowne i zaniżone wyceny.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Sprawy przeciwko ubezpieczycielom</h2>
                            <p class="service-modal__summary">Przełamujemy opór towarzystw ubezpieczeniowych, skutecznie podważając ich niesprawiedliwe decyzje odmowne i zaniżone wyceny.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Analiza decyzji ubezpieczycieli oraz sporządzanie merytorycznych reklamacji i odwołań od stanowiska ubezpieczyciela.</li>
                                <li>Prowadzenie negocjacji ugodowych na etapie przedsądowym w celu szybkiego uzyskania dopłaty do odszkodowania.</li>
                                <li>Wytaczanie procesów sądowych przeciwko ubezpieczycielom w przypadku wyczerpania polubownych metod działania.</li>
                                <li>Weryfikacja poprawności kalkulacji kosztów dokonywanych przez likwidatorów szkód.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Zadośćuczynienie za krzywdę</span>
                            <span class="service-card__text">Walczymy o wysokie rekompensaty finansowe za ból, cierpienie psychiczne oraz negatywne skutki emocjonalne doznane w wyniku wypadku.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Zadośćuczynienie za krzywdę</h2>
                            <p class="service-modal__summary">Walczymy o wysokie rekompensaty finansowe za ból, cierpienie psychiczne oraz negatywne skutki emocjonalne doznane w wyniku wypadku.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Wykazywanie przed sądem rozmiaru doznanej krzywdy, traumy, lęków oraz obniżenia jakości dotychczasowego życia.</li>
                                <li>Dochodzenie zadośćuczynienia dla członków rodziny za śmierć osoby bliskiej lub za zerwanie więzi rodzinnych wskutek ciężkiego kalectwa.</li>
                                <li>Gromadzenie mocnego materiału dowodowego, w tym opinii psychologicznych i psychiatrycznych potwierdzających rozmiar cierpienia.</li>
                                <li>Indywidualne podejście do każdej sprawy w celu uzyskania kwot adekwatnych do realiów i aktualnego orzecznictwa sądów.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Sprawy o błąd medyczny</span>
                            <span class="service-card__text">Reprezentujemy pacjentów oraz ich rodziny w trudnych sporach z placówkami medycznymi i lekarzami, którzy dopuścili się zaniedbań.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Sprawy o błąd medyczny</h2>
                            <p class="service-modal__summary">Reprezentujemy pacjentów oraz ich rodziny w trudnych sporach z placówkami medycznymi i lekarzami, którzy dopuścili się zaniedbań.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Analiza dokumentacji medycznej we współpracy z niezależnymi lekarzami i ekspertami w celu wykazania błędu w sztuce lekarskiej.</li>
                                <li>Prowadzenie spraw o błędy diagnostyczne, terapeutyczne, operacyjne, okołoporodowe oraz zaniedbania w opiece pooperacyjnej.</li>
                                <li>Dochodzenie odszkodowań, zadośćuczynień i dożywotnich rent za uszczerbek na zdrowiu spowodowany złą decyzją personelu medycznego.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Wypadki komunikacyjne</span>
                            <span class="service-card__text">Zapewniamy natychmiastowe i kompleksowe wsparcie prawne dla kierowców, pasażerów, pieszych oraz rowerzystów poszkodowanych na drogach.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Wypadki komunikacyjne</h2>
                            <p class="service-modal__summary">Zapewniamy natychmiastowe i kompleksowe wsparcie prawne dla kierowców, pasażerów, pieszych oraz rowerzystów poszkodowanych na drogach.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Dochodzenie odszkodowań z ubezpieczenia OC sprawcy wypadku za zniszczony pojazd oraz za poniesione obrażenia ciała.</li>
                                <li>Odzyskiwanie kosztów najmu pojazdu zastępczego, holowania, parkowania oraz zakupu odzieży czy wyposażenia zniszczonego w wypadku.</li>
                                <li>Pomoc w sytuacjach, gdy sprawca zbiegł z miejsca zdarzenia lub nie posiadał ważnego ubezpieczenia OC (sprawy przed UFG).</li>
                                <li>Prowadzenie spraw o zadośćuczynienie za śmierć bliskiej osoby w wypadku drogowym, bez względu na to, jak dawno temu doszło do zdarzenia.</li>
                            </ul>
                        </template>
                    </article>
                </div>
            </div>
        </section>

        <div class="service-modal" data-service-modal aria-hidden="true">
            <div class="service-modal__overlay" data-service-modal-close></div>
            <section class="service-modal__dialog" role="dialog" aria-modal="true" tabindex="-1" data-service-dialog>
                <button class="service-modal__close" type="button" data-service-modal-close aria-label="Zamknij">×</button>
                <div data-service-modal-body></div>
            </section>
        </div>
    </main>

    <div data-include="/partials/footer.html"></div>

    <script src="/js/main.js?v=20260822-44" defer></script>
    <script src="/js/services.js?v=20260822-44" defer></script>
</body>

</html>
