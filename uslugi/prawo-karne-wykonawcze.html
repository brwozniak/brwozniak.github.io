<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prawo Karne Wykonawcze | Kancelaria Brunon Woźniak</title>

    <link rel="stylesheet" href="/css/tokens.css?v=20260822-43" />
    <link rel="stylesheet" href="/css/base.css?v=20260822-43" />
    <link rel="stylesheet" href="/css/layout.css?v=20260822-43" />
    <link rel="stylesheet" href="/css/components.css?v=20260822-43" />
</head>

<body>
    <div data-include="/partials/header.html"></div>

    <main>
        <section class="section section--hero">
            <div class="container services-page">
                <header class="services-page__header">
                    <h1 class="services-page__title">Prawo Karne Wykonawcze</h1>
                    <p class="services-page__lead">Wyrok skazujący nie kończy postępowania – prawo karne wykonawcze daje narzędzia do walki o jak najmniej uciążliwy sposób odbywania kary. Pomagamy skazanym oraz ich rodzinom w formalnym i skutecznym uregulowaniu sytuacji po uprawomocnieniu się wyroku.</p>
                </header>


                <div class="service-cards" aria-label="Zakres usługi">
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Dozór elektroniczny</span>
                            <span class="service-card__text">Pomagamy w uzyskaniu zgody na odbywanie kary pozbawienia wolności w warunkach domowych, co pozwala na zachowanie pracy i kontaktu z rodziną.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Dozór elektroniczny</h2>
                            <p class="service-modal__summary">Pomagamy w uzyskaniu zgody na odbywanie kary pozbawienia wolności w warunkach domowych, co pozwala na zachowanie pracy i kontaktu z rodziną.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Kompleksowe przygotowanie wniosku o odbywanie kary w Systemie Dozoru Elektronicznego (SDE).</li>
                                <li>Reprezentacja przed sądem penitencjarnym oraz pomoc w wykazaniu spełnienia warunków technicznych i formalnych.</li>
                                <li>Sporządzanie optymalnych harmonogramów dnia, uwzględniających czas na pracę, obowiązki domowe i praktyki religijne.</li>
                                <li>Pomoc w uzyskiwaniu zgody na zmianę miejsca odbywania kary lub modyfikację godzin poza domem.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Odroczenie wykonania kary</span>
                            <span class="service-card__text">Skutecznie dążymy do przesunięcia terminu stawienia się w zakładzie karnym, gdy natychmiastowe wykonanie wyroku niosłoby zbyt ciężkie skutki.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Odroczenie wykonania kary</h2>
                            <p class="service-modal__summary">Skutecznie dążymy do przesunięcia terminu stawienia się w zakładzie karnym, gdy natychmiastowe wykonanie wyroku niosłoby zbyt ciężkie skutki.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Przygotowywanie wniosków o odroczenie wykonania kary z przyczyn zdrowotnych, rodzinnych lub osobistych.</li>
                                <li>Reprezentacja na posiedzeniach sądowych i gromadzenie mocnego materiału dowodowego (np. dokumentacji medycznej).</li>
                                <li>Składanie wniosków o wstrzymanie wykonania kary do czasu merytorycznego rozpoznania głównego wniosku.</li>
                                <li>Prowadzenie spraw zmierzających do późniejszego zawieszenia wykonania odroczonej kary (w określonych prawem przypadkach).</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Przerwa w wykonywaniu kary</span>
                            <span class="service-card__text">Walczymy o czasowe opuszczenie zakładu karnego przez skazanego, którego sytuacja życiowa lub zdrowotna uległa nagłemu pogorszeniu.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Przerwa w wykonywaniu kary</h2>
                            <p class="service-modal__summary">Walczymy o czasowe opuszczenie zakładu karnego przez skazanego, którego sytuacja życiowa lub zdrowotna uległa nagłemu pogorszeniu.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Sporządzanie wniosków o udzielenie przerwy w odbywaniu kary ze względu na ciężką chorobę lub wyjątkowo trudną sytuację rodziny.</li>
                                <li>Reprezentacja osadzonego przed sądami penitencjarnymi oraz nadzór nad prawidłowym obiegiem opinii lekarskich.</li>
                                <li>Pomoc w formalnym przedłużaniu udzielonych już przerw w odbywaniu kary.</li>
                                <li>Przygotowywanie gruntu prawnego pod wniosek o warunkowe przedterminowe zwolnienie po rocznej przerwie w karze.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Warunkowe przedterminowe zwolnienie</span>
                            <span class="service-card__text">Wspieramy skazanych w staraniach o wcześniejsze wyjście na wolność, wykazując ich pozytywną prognozę kryminologiczno-społeczną.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Warunkowe przedterminowe zwolnienie</h2>
                            <p class="service-modal__summary">Wspieramy skazanych w staraniach o wcześniejsze wyjście na wolność, wykazując ich pozytywną prognozę kryminologiczno-społeczną.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Ocena spełnienia przesłanek formalnych (odbycie wymaganej części kary) i analiza szans na sukces.</li>
                                <li>Przygotowywanie szczegółowych wniosków o warunkowe przedterminowe zwolnienie z zakładu karnego.</li>
                                <li>Pozyskiwanie opinii z administracji więziennej i wykazywanie wzorowego zachowania oraz resocjalizacji skazanego.</li>
                                <li>Reprezentacja skazanego na posiedzeniach sądu penitencjarnego na terenie całego kraju.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Zamiana kary</span>
                            <span class="service-card__text">Pomagamy w formalnym przekształceniu zasądzonej kary na inną formę, która pozwala uniknąć osadzenia w zakładzie karnym.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Zamiana kary</h2>
                            <p class="service-modal__summary">Pomagamy w formalnym przekształceniu zasądzonej kary na inną formę, która pozwala uniknąć osadzenia w zakładzie karnym.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Prowadzenie spraw o zamianę kary grzywny lub ograniczenia wolności na pracę społecznie użyteczną.</li>
                                <li>Obrona w sprawach, w których sąd dąży do zamiany kary wolnościowej na zastępczą karę pozbawienia wolności.</li>
                                <li>Składanie wniosków o umorzenie lub rozłożenie na raty należności sądowych, aby zapobiec ich zamianie na więzienie.</li>
                                <li>Weryfikacja możliwości zamiany kar łącznych w celu skrócenia rzeczywistego czasu odbywania wyroku.</li>
                            </ul>
                        </template>
                    </article>
                </div>
            </div>
        </section>

        <div class="service-modal" data-service-modal aria-hidden="true">
            <div class="service-modal__overlay" data-service-modal-close></div>
            <section class="service-modal__dialog" role="dialog" aria-modal="true" tabindex="-1" data-service-dialog>
                <button class="service-modal__close" type="button" data-service-modal-close aria-label="Zamknij">×</button>
                <div data-service-modal-body></div>
            </section>
        </div>
    </main>

    <div data-include="/partials/footer.html"></div>

    <script src="/js/main.js?v=20260822-43" defer></script>
    <script src="/js/services.js?v=20260822-43" defer></script>
</body>

</html>
