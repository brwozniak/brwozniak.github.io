<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Obsługa Przedsiębiorców | Kancelaria Brunon Woźniak</title>

    <link rel="stylesheet" href="/css/tokens.css?v=20260822-45" />
    <link rel="stylesheet" href="/css/base.css?v=20260822-45" />
    <link rel="stylesheet" href="/css/layout.css?v=20260822-45" />
    <link rel="stylesheet" href="/css/components.css?v=20260822-45" />
</head>

<body>
    <div data-include="/partials/header.html"></div>

    <main>
        <section class="section section--hero">
            <div class="container services-page">
                <header class="services-page__header">
                    <h1 class="services-page__title">Obsługa Przedsiębiorców</h1>
                    <p class="services-page__lead">Zdejmujemy z barków przedsiębiorców ciężar formalności prawnych, pozwalając im skupić się na rozwoju biznesu. Oferujemy nowoczesne, dynamiczne i w pełni bezpieczne wsparcie prawne dla jednoosobowych działalności gospodarczych (JDG), spółek oraz startupów.</p>
                </header>


                <div class="service-cards" aria-label="Zakres usługi">
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Bieżąca obsługa prawna przedsiębiorców</span>
                            <span class="service-card__text">Zapewniamy stałą, codzienną opiekę prawną, która pozwala na natychmiastowe reagowanie na wyzwania i zapobieganie kryzysom w firmie.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Bieżąca obsługa prawna przedsiębiorców</h2>
                            <p class="service-modal__summary">Zapewniamy stałą, codzienną opiekę prawną, która pozwala na natychmiastowe reagowanie na wyzwania i zapobieganie kryzysom w firmie.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Doradztwo i konsultacje prawne w bieżących sprawach operacyjnych i handlowych przedsiębiorstwa.</li>
                                <li>Optymalizacja procesów biznesowych pod kątem zgodności z aktualnymi, dynamicznie zmieniającymi się przepisami.</li>
                                <li>Monitorowanie ryzyk prawnych w kontaktach z kontrahentami, podwykonawcami oraz instytucjami państwowymi.</li>
                                <li>Szybkie opinie prawne oraz wsparcie w podejmowaniu kluczowych, strategicznych decyzji zarządczych.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Analiza i sporządzanie regulaminów, umów, uchwał</span>
                            <span class="service-card__text">Tworzymy precyzyjną i bezpieczną dokumentację firmową, która w 100% chroni interesy i majątek Twojego przedsiębiorstwa.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Analiza i sporządzanie regulaminów, umów, uchwał</h2>
                            <p class="service-modal__summary">Tworzymy precyzyjną i bezpieczną dokumentację firmową, która w 100% chroni interesy i majątek Twojego przedsiębiorstwa.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Konstruowanie i weryfikacja kontraktów handlowych, umów NDA (o poufności), umów inwestycyjnych oraz B2B.</li>
                                <li>Przygotowywanie zgodnych z prawem regulaminów serwisów internetowych, e-sklepów (e-commerce) oraz polityk prywatności (RODO).</li>
                                <li>Sporządzanie formalnych uchwał zarządu, rady nadzorczej, zgromadzeń wspólników oraz innych wewnętrznych aktów korporacyjnych.</li>
                                <li>Eliminowanie z umów klauzul abuzywnych oraz zapisów, które mogłyby narazić firmę na straty lub kary umowne.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Obsługa spółek oraz udział w posiedzeniach</span>
                            <span class="service-card__text">Zapewniamy kompleksowe wsparcie w zakładaniu, prowadzeniu i formalnym nadzorze nad funkcjonowaniem spółek prawa handlowego.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Obsługa spółek oraz udział w posiedzeniach</h2>
                            <p class="service-modal__summary">Zapewniamy kompleksowe wsparcie w zakładaniu, prowadzeniu i formalnym nadzorze nad funkcjonowaniem spółek prawa handlowego.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Pomoc w procesie rejestracji, przekształcania, łączenia, podziału oraz likwidacji spółek w rejestrze KRS.</li>
                                <li>Przygotowywanie, organizacja oraz osobisty udział radcy prawnego/adwokata w zgromadzeniach wspólników i posiedzeniach organów spółki.</li>
                                <li>Projektowanie i modyfikowanie umów oraz statutów spółek, optymalnie dopasowanych do celów biznesowych założycieli.</li>
                                <li>Rozwiązywanie wewnętrznych konfliktów korporacyjnych pomiędzy wspólnikami lub akcjonariuszami.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Sprawy sądowe z kontrahentami, pracownikami</span>
                            <span class="service-card__text">Reprezentujemy Twoją firmę przed sądami wszystkich instancji, twardo walcząc o wygraną i minimalizując koszty procesowe.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Sprawy sądowe z kontrahentami, pracownikami</h2>
                            <p class="service-modal__summary">Reprezentujemy Twoją firmę przed sądami wszystkich instancji, twardo walcząc o wygraną i minimalizując koszty procesowe.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Prowadzenie sporów gospodarczych wynikających z niewykonania umów, nienależytej jakości usług lub opóźnień dostawców.</li>
                                <li>Obrona interesów pracodawcy w sporach z pracownikami o nadgodziny, odszkodowania, mobbing czy zwolnienia dyscyplinarne.</li>
                                <li>Reprezentacja w sprawach dotyczących nieuczciwej konkurencji, naruszenia tajemnicy przedsiębiorstwa lub praw autorskich.</li>
                                <li>Opracowywanie strategii procesowych, sporządzanie pism, pozwów oraz odpowiedzi na pozwy.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Windykacja należności</span>
                            <span class="service-card__text">Skutecznie i szybko odzyskujemy zamrożone w fakturach pieniądze, dbając o utrzymanie płynności finansowej Twojego biznesu.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Windykacja należności</h2>
                            <p class="service-modal__summary">Skutecznie i szybko odzyskujemy zamrożone w fakturach pieniądze, dbając o utrzymanie płynności finansowej Twojego biznesu.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Prowadzenie miękkiej i twardej windykacji przedsądowej – od wezwań do zapłaty po profesjonalne negocjacje ugodowe.</li>
                                <li>Uzyskiwanie szybkich nakazów zapłaty w postępowaniach upominawczych, nakazowych oraz przed EPU (Elektroniczne Postępowanie Upominawcze).</li>
                                <li>Nadzór nad postępowaniem komorniczym, aktywne poszukiwanie majątku dłużnika i przeciwdziałanie jego wyprzedawaniu.</li>
                                <li>Dochodzenie odpowiedzialności członków zarządu za długi spółki (np. z art. 299 KSH) w przypadku bezskutecznej egzekucji.</li>
                            </ul>
                        </template>
                    </article>
                </div>
            </div>
        </section>

        <div class="service-modal" data-service-modal aria-hidden="true">
            <div class="service-modal__overlay" data-service-modal-close></div>
            <section class="service-modal__dialog" role="dialog" aria-modal="true" tabindex="-1" data-service-dialog>
                <button class="service-modal__close" type="button" data-service-modal-close aria-label="Zamknij">×</button>
                <div data-service-modal-body></div>
            </section>
        </div>
    </main>

    <div data-include="/partials/footer.html"></div>

    <script src="/js/main.js?v=20260822-45" defer></script>
    <script src="/js/services.js?v=20260822-45" defer></script>
</body>

</html>
