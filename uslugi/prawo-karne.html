<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prawo Karne | Kancelaria Brunon Woźniak</title>

    <link rel="stylesheet" href="/css/tokens.css?v=20260822-45" />
    <link rel="stylesheet" href="/css/base.css?v=20260822-45" />
    <link rel="stylesheet" href="/css/layout.css?v=20260822-45" />
    <link rel="stylesheet" href="/css/components.css?v=20260822-45" />
</head>

<body>
    <div data-include="/partials/header.html"></div>

    <main>
        <section class="section section--hero">
            <div class="container services-page">
                <header class="services-page__header">
                    <h1 class="services-page__title">Prawo Karne</h1>
                    <p class="services-page__lead">W sprawach karnych czas i precyzyjna strategia mają kluczowe znaczenie. Zapewniamy profesjonalną obronę oraz wsparcie prawne na każdym etapie postępowania, dbając o bezwzględną ochronę Twoich praw i wolności.</p>
                </header>


                <div class="service-cards" aria-label="Zakres usługi">
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Reprezentacja podejrzanych i oskarżonych</span>
                            <span class="service-card__text">Budujemy skuteczną linię obrony, reprezentując osoby, którym postawiono zarzuty lub przeciwko którym skierowano akt oskarżenia.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Reprezentacja podejrzanych i oskarżonych</h2>
                            <p class="service-modal__summary">Budujemy skuteczną linię obrony, reprezentując osoby, którym postawiono zarzuty lub przeciwko którym skierowano akt oskarżenia.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Analiza materiału dowodowego pod kątem uchybień proceduralnych i możliwości uniewinnienia.</li>
                                <li>Udział w przesłuchaniach, posiedzeniach aresztowych oraz kluczowych czynnościach procesowych.</li>
                                <li>Sporządzanie wniosków dowodowych, zażaleń, apelacji oraz kasacji do Sądu Najwyższego.</li>
                                <li>Aktywne dążenie do umorzenia postępowania, warunkowego umorzenia lub złagodzenia kary.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Pomoc pokrzywdzonym</span>
                            <span class="service-card__text">Reprezentujemy interesy osób pokrzywdzonych przestępstwem, dbając o sprawiedliwy wyrok oraz uzyskanie należnego zadośćuczynienia.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Pomoc pokrzywdzonym</h2>
                            <p class="service-modal__summary">Reprezentujemy interesy osób pokrzywdzonych przestępstwem, dbając o sprawiedliwy wyrok oraz uzyskanie należnego zadośćuczynienia.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Sporządzanie i składanie zawiadomień o podejrzeniu popełnienia przestępstwa.</li>
                                <li>Występowanie w procesie karnym w charakterze oskarżyciela posiłkowego lub prywatnego.</li>
                                <li>Dochodzenie naprawienia szkody, nawiązek oraz odszkodowań za doznaną krzywdę bezpośrednio w procesie karnym.</li>
                                <li>Monitorowanie działań organów ścigania, aby prawa pokrzywdzonego nie zostały pominięte.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Sprawy karnoskarbowe</span>
                            <span class="service-card__text">Zapewniamy specjalistyczną pomoc prawną w sprawach o przestępstwa i wykroczenia przeciwko obowiązkom podatkowym i celnym.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Sprawy karnoskarbowe</h2>
                            <p class="service-modal__summary">Zapewniamy specjalistyczną pomoc prawną w sprawach o przestępstwa i wykroczenia przeciwko obowiązkom podatkowym i celnym.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Obrona w sprawach dotyczących m.in. uszczuplenia podatków, karuzel VAT, nierzetelnych faktur czy przemytu.</li>
                                <li>Reprezentacja przed urzędami skarbowymi, urzędami celno-skarbowymi oraz sądami powszechnymi.</li>
                                <li>Prowadzenie negocjacji w celu skorzystania z instytucji dobrowolnego poddania się odpowiedzialności (DPO).</li>
                                <li>Minimalizowanie ryzyka dotkliwych sankcji finansowych oraz kar pozbawienia wolności dla przedsiębiorców i osób prywatnych.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Reprezentacja przed organami ścigania oraz przed sądem</span>
                            <span class="service-card__text">Gwarantujemy profesjonalną obecność i obronę Twoich interesów na każdym poziomie struktury wymiaru sprawiedliwości.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Reprezentacja przed organami ścigania oraz przed sądem</h2>
                            <p class="service-modal__summary">Gwarantujemy profesjonalną obecność i obronę Twoich interesów na każdym poziomie struktury wymiaru sprawiedliwości.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Udział w czynnościach przed Policją, Prokuraturą, Centralnym Biurem Śledczym Policji (CBŚP) oraz innymi służbami.</li>
                                <li>Zapewnienie pełnej obrony na rozprawach i posiedzeniach przed sądami rejonowymi, okręgowymi i apelacyjnymi.</li>
                                <li>Kontrola legalności działań podejmowanych przez organy ścigania w trakcie zabezpieczania dowodów.</li>
                                <li>Natychmiastowe reagowanie na dynamiczny rozwój sytuacji procesowej klienta.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Kontakt z klientem w zakładzie karnym lub areszcie śledczym</span>
                            <span class="service-card__text">Oferujemy pilne wsparcie prawne dla osób zatrzymanych i tymczasowo aresztowanych, zapewniając stały i poufny przepływ informacji.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Kontakt z klientem w zakładzie karnym lub areszcie śledczym</h2>
                            <p class="service-modal__summary">Oferujemy pilne wsparcie prawne dla osób zatrzymanych i tymczasowo aresztowanych, zapewniając stały i poufny przepływ informacji.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Realizowanie osobistych widzeń z klientem w zakładach karnych i aresztach śledczych na terenie całego kraju.</li>
                                <li>Składanie zażaleń na postanowienia o zastosowaniu lub przedłużeniu tymczasowego aresztowania.</li>
                                <li>Pomoc w uzyskiwaniu przepustek, zgody na widzenia z rodziną oraz dostępu do opieki medycznej.</li>
                                <li>Reprezentacja w postępowaniu wykonawczym (sprawy o odroczenie kary, przerwę w karze, przedterminowe zwolnienie czy dozór elektroniczny).</li>
                            </ul>
                        </template>
                    </article>
                </div>
            </div>
        </section>

        <div class="service-modal" data-service-modal aria-hidden="true">
            <div class="service-modal__overlay" data-service-modal-close></div>
            <section class="service-modal__dialog" role="dialog" aria-modal="true" tabindex="-1" data-service-dialog>
                <button class="service-modal__close" type="button" data-service-modal-close aria-label="Zamknij">×</button>
                <div data-service-modal-body></div>
            </section>
        </div>
    </main>

    <div data-include="/partials/footer.html"></div>

    <script src="/js/main.js?v=20260822-45" defer></script>
    <script src="/js/services.js?v=20260822-45" defer></script>
</body>

</html>
