<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spadki i Testamenty | Kancelaria Brunon Woźniak</title>

    <link rel="stylesheet" href="/css/tokens.css?v=20260822-44" />
    <link rel="stylesheet" href="/css/base.css?v=20260822-44" />
    <link rel="stylesheet" href="/css/layout.css?v=20260822-44" />
    <link rel="stylesheet" href="/css/components.css?v=20260822-44" />
</head>

<body>
    <div data-include="/partials/header.html"></div>

    <main>
        <section class="section section--hero">
            <div class="container services-page">
                <header class="services-page__header">
                    <h1 class="services-page__title">Spadki i Testamenty</h1>
                    <p class="services-page__lead">Sprawy spadkowe bywają skomplikowane i emocjonalne, dlatego wymagają precyzyjnego podejścia prawnego. Pomagamy formalnie uporządkować kwestie majątkowe po bliskich, zabezpieczyć Twoje udziały oraz skutecznie przejść przez procedury spadkowe.</p>
                </header>


                <div class="service-cards" aria-label="Zakres usługi">
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Stwierdzenie nabycia spadku</span>
                            <span class="service-card__text">Pomagamy formalnie potwierdzić Twoje prawa do majątku spadkowego przed sądem lub notariuszem, otwierając drogę do dysponowania spadkiem.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Stwierdzenie nabycia spadku</h2>
                            <p class="service-modal__summary">Pomagamy formalnie potwierdzić Twoje prawa do majątku spadkowego przed sądem lub notariuszem, otwierając drogę do dysponowania spadkiem.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Przygotowywanie wniosków o stwierdzenie nabycia spadku na podstawie ustawy lub testamentu.</li>
                                <li>Reprezentacja w sądowych postępowaniach spadkowych oraz pomoc w kompletowaniu niezbędnych aktów stanu cywilnego.</li>
                                <li>Doradztwo w zakresie bezpiecznego przyjęcia spadku (z dobrodziejstwem inwentarza) lub jego odrzucenia w celu uniknięcia długów.</li>
                                <li>Ustalanie kręgu spadkobierców oraz poszukiwanie testamentów i innych dokumentów sukcesyjnych.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Dział spadku</span>
                            <span class="service-card__text">Pomagamy sprawiedliwie i zgodnie z prawem podzielić odziedziczony majątek pomiędzy wszystkich spadkobierców, kończąc współwłasność.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Dział spadku</h2>
                            <p class="service-modal__summary">Pomagamy sprawiedliwie i zgodnie z prawem podzielić odziedziczony majątek pomiędzy wszystkich spadkobierców, kończąc współwłasność.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Prowadzenie spraw o umowny (notarialny) oraz sądowy dział spadku wraz ze zniesieniem współwłasności nieruchomości i kont.</li>
                                <li>Rozliczanie darowizn otrzymanych przez spadkobierców od spadkodawcy za jego życia (zaliczenie na schedę spadkową).</li>
                                <li>Reprezentacja w sporach dotyczących wyceny poszczególnych składników majątku oraz wysokości spłat i dopłat finansowych.</li>
                                <li>Rozliczanie nakładów poczynionych na majątek spadkowy przez poszczególnych spadkobierców po śmierci spadkodawcy.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Zachowek</span>
                            <span class="service-card__text">Skutecznie reprezentujemy klientów w walce o należne im wsparcie finansowe lub bronimy przed wygórowanymi roszczeniami o zachowek.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Zachowek</h2>
                            <p class="service-modal__summary">Skutecznie reprezentujemy klientów w walce o należne im wsparcie finansowe lub bronimy przed wygórowanymi roszczeniami o zachowek.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Dochodzenie roszczeń o zachowek dla osób pominiętych w testamencie (dzieci, małżonków, rodziców).</li>
                                <li>Precyzyjne wyliczanie substratu zachowku, w tym doliczanie do masy spadkowej darowizn dokonanych przez zmarłego przed laty.</li>
                                <li>Obrona spadkobierców i obdarowanych przed pozwami o zachowek oraz dążenie do obniżenia lub miarkowania jego wysokości.</li>
                                <li>Prowadzenie negocjacji pozasądowych i zawieranie bezpiecznych ugód w sprawach o zachowek.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Niegodność dziedziczenia</span>
                            <span class="service-card__text">Wykazujemy przed sądem rażące i bezprawne zachowania spadkobiercy, które powinny wykluczyć go z kręgu osób dziedziczących.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Niegodność dziedziczenia</h2>
                            <p class="service-modal__summary">Wykazujemy przed sądem rażące i bezprawne zachowania spadkobiercy, które powinny wykluczyć go z kręgu osób dziedziczących.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Wytaczanie powództw o uznanie spadkobiercy za niegodnego dziedziczenia z przyczyn określonych w Kodeksie cywilnym.</li>
                                <li>Gromadzenie dowodów na celowe działanie przeciwko spadkodawcy, zniszczenie testamentu lub nakłonienie do jego zmiany.</li>
                                <li>Reprezentacja w procesach sądowych zmierzających do traktowania niegodnego spadkobiercy tak, jakby nie dożył otwarcia spadku.</li>
                                <li>Obrona osób niesłusznie pomawianych o zachowania skutkujące niegodnością dziedziczenia.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Wydziedziczenie</span>
                            <span class="service-card__text">Pomagamy skutecznie i zgodnie z prawem pozbawić uprawnień do zachowku osoby, które rażąco zaniedbywały obowiązki rodzinne.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Wydziedziczenie</h2>
                            <p class="service-modal__summary">Pomagamy skutecznie i zgodnie z prawem pozbawić uprawnień do zachowku osoby, które rażąco zaniedbywały obowiązki rodzinne.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Analiza zapisów testamentowych pod kątem skuteczności prawnej dokonanych wydziedziczeń.</li>
                                <li>Podważanie w procesie o zachowek bezpodstawnych zapisów o wydziedziczeniu zawartych w testamencie zmarłego.</li>
                                <li>Doradztwo przy formułowaniu ważnych i niepodważalnych przyczyn wydziedziczenia na etapie spisywania testamentu.</li>
                                <li>Wykazywanie przed sądem, czy zachowanie uprawnionego do zachowku rzeczywiście wyczerpywało ustawowe przesłanki wydziedziczenia.</li>
                            </ul>
                        </template>
                    </article>
                </div>
            </div>
        </section>

        <div class="service-modal" data-service-modal aria-hidden="true">
            <div class="service-modal__overlay" data-service-modal-close></div>
            <section class="service-modal__dialog" role="dialog" aria-modal="true" tabindex="-1" data-service-dialog>
                <button class="service-modal__close" type="button" data-service-modal-close aria-label="Zamknij">×</button>
                <div data-service-modal-body></div>
            </section>
        </div>
    </main>

    <div data-include="/partials/footer.html"></div>

    <script src="/js/main.js?v=20260822-44" defer></script>
    <script src="/js/services.js?v=20260822-44" defer></script>
</body>

</html>
