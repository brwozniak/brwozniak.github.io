<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prawo Rodzinne | Kancelaria Brunon Woźniak</title>

    <link rel="stylesheet" href="/css/tokens.css?v=20260822-43" />
    <link rel="stylesheet" href="/css/base.css?v=20260822-43" />
    <link rel="stylesheet" href="/css/layout.css?v=20260822-43" />
    <link rel="stylesheet" href="/css/components.css?v=20260822-43" />
</head>

<body>
    <div data-include="/partials/header.html"></div>

    <main>
        <section class="section section--hero">
            <div class="container services-page">
                <header class="services-page__header">
                    <h1 class="services-page__title">Prawo Rodzinne</h1>
                    <p class="services-page__lead">Sprawy rodzinne wymagają nie tylko biegłej znajomości przepisów, ale też szczególnej delikatności i zrozumienia. Zapewniamy pełne wsparcie prawne, chroniąc interesy Twoje oraz Twoich najbliższych w trudnych momentach życiowych.</p>
                </header>


                <div class="service-cards" aria-label="Zakres usługi">
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Rozwód</span>
                            <span class="service-card__text">Przeprowadzamy przez proces rozstania w sposób sprawny i zorganizowany, minimalizując stres oraz dbając o Twoją przyszłość.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Rozwód</h2>
                            <p class="service-modal__summary">Przeprowadzamy przez proces rozstania w sposób sprawny i zorganizowany, minimalizując stres oraz dbając o Twoją przyszłość.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Kompleksowe przygotowanie pozwu rozwodowego oraz reprezentacja na rozprawach sądowych.</li>
                                <li>Prowadzenie spraw z orzekaniem o wyłącznej winie małżonka lub bez orzekania o winie.</li>
                                <li>Pomoc w zabezpieczeniu kluczowych kwestii na czas trwania procesu sądowego.</li>
                                <li>Doradztwo i negocjacje w celu polubownego wypracowania porozumienia rozwodowego.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Podział majątku</span>
                            <span class="service-card__text">Pomagamy sprawiedliwie i zgodnie z prawem rozliczyć wspólny dorobek życiowy, dbając o Twoje bezpieczeństwo finansowe.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Podział majątku</h2>
                            <p class="service-modal__summary">Pomagamy sprawiedliwie i zgodnie z prawem rozliczyć wspólny dorobek życiowy, dbając o Twoje bezpieczeństwo finansowe.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Prowadzenie spraw o umowny (notarialny) oraz sądowy podział majątku wspólnego.</li>
                                <li>Ustalanie nierównych udziałów w majątku wspólnym w uzasadnionych przypadkach.</li>
                                <li>Rozliczanie nakładów i wydatków poczynionych z majątku osobistego na majątek wspólny i odwrotnie.</li>
                                <li>Precyzyjna wycena i podział składników majątkowych, takich jak nieruchomości, firmy czy oszczędności.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Władza rodzicielska</span>
                            <span class="service-card__text">Dbamy o zabezpieczenie dobra dzieci, pomagając skutecznie uregulować prawa i obowiązki rodzicielskie.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Władza rodzicielska</h2>
                            <p class="service-modal__summary">Dbamy o zabezpieczenie dobra dzieci, pomagając skutecznie uregulować prawa i obowiązki rodzicielskie.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Reprezentacja w sprawach o powierzenie, ograniczenie, pozbawienie lub przywrócenie władzy rodzicielskiej.</li>
                                <li>Tworzenie i wdrażanie rodzicielskich planów wychowawczych akceptowanych przez sądy.</li>
                                <li>Pomoc w uzyskiwaniu zgody sądu na istotne decyzje dotyczące dziecka w przypadku braku porozumienia rodziców.</li>
                                <li>Ochrona praw rodzica i dziecka w sytuacjach kryzysowych oraz konfliktowych.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Ustalenie kontaktów z dzieckiem</span>
                            <span class="service-card__text">Dążymy do stworzenia jasnych i stabilnych zasad widzeń z dziećmi, które zapewnią im poczucie bezpieczeństwa i spokoju.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Ustalenie kontaktów z dzieckiem</h2>
                            <p class="service-modal__summary">Dążymy do stworzenia jasnych i stabilnych zasad widzeń z dziećmi, które zapewnią im poczucie bezpieczeństwa i spokoju.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Prowadzenie postępowań o sądowe ustalenie, zmianę lub egzekwowanie kontaktów z dzieckiem.</li>
                                <li>Konstruowanie precyzyjnych harmonogramów spotkań, uwzględniających święta, wakacje i dni powszednie.</li>
                                <li>Pomoc w sprawach o zakazanie kontaktów lub realizowanie ich wyłącznie w obecności kuratora/drugiego rodzica.</li>
                                <li>Egzekwowanie nałożonych przez sąd kar finansowych za utrudnianie wyznaczonych kontaktów.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Alimenty</span>
                            <span class="service-card__text">Skutecznie walczymy o adekwatne środki finansowe niezbędne do utrzymania dziecka lub obronę przed zawyżonymi roszczeniami.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Alimenty</h2>
                            <p class="service-modal__summary">Skutecznie walczymy o adekwatne środki finansowe niezbędne do utrzymania dziecka lub obronę przed zawyżonymi roszczeniami.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Prowadzenie spraw o ustalenie, podwyższenie, obniżenie lub całkowite wygaśnięcie obowiązku alimentacyjnego.</li>
                                <li>Precyzyjne wyliczanie usprawiedliwionych potrzeb dziecka oraz realnych możliwości zarobkowych rodzica.</li>
                                <li>Uzyskiwanie natychmiastowego zabezpieczenia alimentów na czas trwania właściwego postępowania sądowego.</li>
                                <li>Dochodzenie roszczeń alimentacyjnych od innych członków rodziny lub pomoc w egzekucji zaległości.</li>
                            </ul>
                        </template>
                    </article>
                </div>
            </div>
        </section>

        <div class="service-modal" data-service-modal aria-hidden="true">
            <div class="service-modal__overlay" data-service-modal-close></div>
            <section class="service-modal__dialog" role="dialog" aria-modal="true" tabindex="-1" data-service-dialog>
                <button class="service-modal__close" type="button" data-service-modal-close aria-label="Zamknij">×</button>
                <div data-service-modal-body></div>
            </section>
        </div>
    </main>

    <div data-include="/partials/footer.html"></div>

    <script src="/js/main.js?v=20260822-43" defer></script>
    <script src="/js/services.js?v=20260822-43" defer></script>
</body>

</html>
