<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prawo Nieruchomości | Kancelaria Brunon Woźniak</title>

    <link rel="stylesheet" href="/css/tokens.css?v=20260822-45" />
    <link rel="stylesheet" href="/css/base.css?v=20260822-45" />
    <link rel="stylesheet" href="/css/layout.css?v=20260822-45" />
    <link rel="stylesheet" href="/css/components.css?v=20260822-45" />
</head>

<body>
    <div data-include="/partials/header.html"></div>

    <main>
        <section class="section section--hero">
            <div class="container services-page">
                <header class="services-page__header">
                    <h1 class="services-page__title">Prawo Nieruchomości</h1>
                    <p class="services-page__lead">Transakcje i spory związane z nieruchomościami wymagają szczególnego bezpieczeństwa i precyzji. Pomagamy skutecznie regulować stan prawny Twoich obiektów, gruntów oraz lokali, chroniąc Twój majątek.</p>
                </header>


                <div class="service-cards" aria-label="Zakres usługi">
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Zniesienie współwłasności</span>
                            <span class="service-card__text">Pomagamy sprawnie i zgodnie z prawem podzielić wspólny majątek, dbając o sprawiedliwe rozliczenie wszystkich współwłaścicieli.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Zniesienie współwłasności</h2>
                            <p class="service-modal__summary">Pomagamy sprawnie i zgodnie z prawem podzielić wspólny majątek, dbając o sprawiedliwe rozliczenie wszystkich współwłaścicieli.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Prowadzenie spraw o umowny oraz sądowy podział nieruchomości.</li>
                                <li>Rozliczanie nakładów poczynionych na nieruchomość przez poszczególnych właścicieli.</li>
                                <li>Reprezentacja w sporach między współwłaścicielami dotyczących zarządzania rzeczą wspólną.</li>
                                <li>Przygotowywanie planów podziału fizycznego nieruchomości lub uregulowania spłat finansowych.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Służebność drogi koniecznej</span>
                            <span class="service-card__text">Zapewniamy formalny i prawny dostęp do drogi publicznej dla nieruchomości, które zostały go pozbawione.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Służebność drogi koniecznej</h2>
                            <p class="service-modal__summary">Zapewniamy formalny i prawny dostęp do drogi publicznej dla nieruchomości, które zostały go pozbawione.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Przeprowadzanie postępowań sądowych o ustanowienie drogi koniecznej.</li>
                                <li>Negocjowanie polubownych umów ze stronami i sąsiadami w celu wyznaczenia szlaku drogowego.</li>
                                <li>Ustalanie wysokości sprawiedliwego wynagrodzenia za obciążenie nieruchomości służebnością.</li>
                                <li>Regulowanie i wpisywanie istniejących służebności do ksiąg wieczystych.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Obsługa prawna w zakresie nieruchomości</span>
                            <span class="service-card__text">Oferujemy kompleksowe wsparcie prawne dla inwestorów, deweloperów, firm oraz klientów indywidualnych na rynku nieruchomości.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Obsługa prawna w zakresie nieruchomości</h2>
                            <p class="service-modal__summary">Oferujemy kompleksowe wsparcie prawne dla inwestorów, deweloperów, firm oraz klientów indywidualnych na rynku nieruchomości.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Bieżące doradztwo przy procesach budowlanych, komercjalizacji i zarządzaniu obiektami.</li>
                                <li>Reprezentacja przed urzędami, sądami oraz instytucjami w sprawach administracyjnych i budowlanych.</li>
                                <li>Pomoc przy legalizacji samowoli budowlanych oraz uzyskiwaniu niezbędnych pozwoleń.</li>
                                <li>Rozwiązywanie sporów z sąsiadami, wykonawcami robót budowlanych czy spółdzielniami.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Sporządzanie i analiza umów (sprzedaży, najmu, dzierżawy, użyczenia)</span>
                            <span class="service-card__text">Tworzymy i weryfikujemy kontrakty tak, aby w pełni zabezpieczyć Twoje prawa jako właściciela, najemcy lub kupującego.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Sporządzanie i analiza umów (sprzedaży, najmu, dzierżawy, użyczenia)</h2>
                            <p class="service-modal__summary">Tworzymy i weryfikujemy kontrakty tak, aby w pełni zabezpieczyć Twoje prawa jako właściciela, najemcy lub kupującego.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Przygotowywanie bezpiecznych umów najmu okazjonalnego, instytucjonalnego oraz dzierżawy.</li>
                                <li>Analiza przedwstępnych i ostatecznych umów sprzedaży nieruchomości pod kątem ryzyka prawnego.</li>
                                <li>Konstruowanie precyzyjnych postanowień dotyczących kaucji, kar umownych i warunków wypowiedzenia.</li>
                                <li>Dostosowywanie treści dokumentów do specyfiki danej nieruchomości i celów klienta.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Analiza stanu prawnego nieruchomości</span>
                            <span class="service-card__text">Prześwietlamy historię i status prawny nieruchomości, eliminując ryzyko zakupu wadliwej lub obciążonej działki bądź lokalu.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Analiza stanu prawnego nieruchomości</h2>
                            <p class="service-modal__summary">Prześwietlamy historię i status prawny nieruchomości, eliminując ryzyko zakupu wadliwej lub obciążonej działki bądź lokalu.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Szczegółowe badanie ksiąg wieczystych pod kątem długów, hipotek i roszczeń osób trzecich.</li>
                                <li>Weryfikacja przeznaczenia gruntu w Miejscowych Planach Zagospodarowania Przestrzennego (MPZP).</li>
                                <li>Identyfikacja i eliminowanie ryzyk związanych z prawami pierwokupu lub roszczeniami dawnych właścicieli.</li>
                                <li>Sporządzanie formalnych raportów z badania stanu prawnego nieruchomości (due diligence).</li>
                            </ul>
                        </template>
                    </article>
                </div>
            </div>
        </section>

        <div class="service-modal" data-service-modal aria-hidden="true">
            <div class="service-modal__overlay" data-service-modal-close></div>
            <section class="service-modal__dialog" role="dialog" aria-modal="true" tabindex="-1" data-service-dialog>
                <button class="service-modal__close" type="button" data-service-modal-close aria-label="Zamknij">×</button>
                <div data-service-modal-body></div>
            </section>
        </div>
    </main>

    <div data-include="/partials/footer.html"></div>

    <script src="/js/main.js?v=20260822-45" defer></script>
    <script src="/js/services.js?v=20260822-45" defer></script>
