<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prawo Administracyjne | Kancelaria Brunon Woźniak</title>

    <link rel="stylesheet" href="/css/tokens.css?v=20260829-4" />
    <link rel="stylesheet" href="/css/base.css?v=20260829-4" />
    <link rel="stylesheet" href="/css/layout.css?v=20260829-4" />
    <link rel="stylesheet" href="/css/components.css?v=20260829-4" />
</head>

<body>
    <div data-include="/partials/header.html"></div>

    <main>
        <section class="section section--hero">
            <div class="container services-page">
                <header class="services-page__header">
                    <h1 class="services-page__title">Prawo Administracyjne</h1>
                    <p class="services-page__lead">Relacje z organami państwowymi i samorządowymi wymagają ścisłego przestrzegania terminów oraz doskonałej znajomości procedur. Pomagamy skutecznie przejść przez skomplikowane postępowania urzędowe, chroniąc Twoje prawa przed arbitralnymi decyzjami administracji.</p>
                </header>


                <div class="service-cards" aria-label="Zakres usługi">
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Postępowanie przed organami</span>
                            <span class="service-card__text">Reprezentujemy interesy obywateli oraz firm na każdym etapie procedury urzędowej, dbając o sprawne i zgodne z prawem załatwienie sprawy.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Postępowanie przed organami</h2>
                            <p class="service-modal__summary">Reprezentujemy interesy obywateli oraz firm na każdym etapie procedury urzędowej, dbając o sprawne i zgodne z prawem załatwienie sprawy.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Sporządzanie wniosków, podań, wyjaśnień oraz zastrzeżeń do protokołów w toku postępowań administracyjnych.</li>
                                <li>Pisanie skutecznych odwołań od niekorzystnych decyzji wydanych przez organy pierwszej instancji (np. do SKO lub wojewody).</li>
                                <li>Zwalczanie bezczynności organów oraz przewlekłości postępowań poprzez składanie formalnych ponagleń.</li>
                                <li>Doradztwo i pomoc w uzyskiwaniu decyzji uznaniowych, koncesji, zezwoleń oraz licencji niezbędnych do prowadzenia działalności.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Rozprawy administracyjne</span>
                            <span class="service-card__text">Zapewniamy profesjonalne wsparcie i osobiste zastępstwo podczas oficjalnych posiedzeń, na których ważą się losy Twojej sprawy.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Rozprawy administracyjne</h2>
                            <p class="service-modal__summary">Zapewniamy profesjonalne wsparcie i osobiste zastępstwo podczas oficjalnych posiedzeń, na których ważą się losy Twojej sprawy.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Przygotowanie merytoryczne klienta oraz strategii argumentacji na rozprawę przed organem administracji publicznej.</li>
                                <li>Aktywne uczestnictwo w przesłuchaniach świadków, oględzinach oraz wyjaśnieniach z udziałem biegłych i ekspertów.</li>
                                <li>Formułowanie wniosków dowodowych i oświadczeń bezpośrednio do protokołu rozprawy w celu zabezpieczenia interesu prawnego.</li>
                                <li>Dążenie do polubownego załatwienia sporu i zawarcia ugody administracyjnej pomiędzy stronami postępowania.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Postępowanie przed WSA oraz NSA</span>
                            <span class="service-card__text">Zaskarżamy wadliwe i niesprawiedliwe decyzje urzędów do sądów administracyjnych, walcząc o ich prawomocne uchylenie.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Postępowanie przed WSA oraz NSA</h2>
                            <p class="service-modal__summary">Zaskarżamy wadliwe i niesprawiedliwe decyzje urzędów do sądów administracyjnych, walcząc o ich prawomocne uchylenie.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Sporządzanie i wnoszenie skarg na decyzje administracyjne do Wojewódzkich Sądów Administracyjnych (WSA).</li>
                                <li>Przygotowywanie profesjonalnych skarg kasacyjnych od wyroków WSA do Naczelnego Sądu Administracyjnego (NSA).</li>
                                <li>Reprezentowanie klientów oraz wygłaszanie młów obrończych na rozprawach przed sądami administracyjnymi obu instancji.</li>
                                <li>Wnioskowanie o wstrzymanie wykonania zaskarżonej decyzji w celu uniknięcia nieodwracalnych skutków przed wyrokiem sądu.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Sprawy związane z nieruchomościami</span>
                            <span class="service-card__text">Regulujemy i zabezpieczamy status prawny gruntów oraz budynków w relacjach z administracją publiczną.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Sprawy związane z nieruchomościami</h2>
                            <p class="service-modal__summary">Regulujemy i zabezpieczamy status prawny gruntów oraz budynków w relacjach z administracją publiczną.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Prowadzenie postępowań w sprawach o ustalenie warunków zabudowy (tzw. &quot;wz-tek&quot;) oraz lokalizacji inwestycji celu publicznego.</li>
                                <li>Reprezentacja w sprawach dotyczących podziału, scalania oraz rozgraniczania nieruchomości przed organami gminnymi.</li>
                                <li>Dochodzenie odszkodowań za nieruchomości przejęte pod drogi publiczne (w trybie tzw. specustawy drogowej) lub wywłaszczone.</li>
                                <li>Analiza i zaskarżanie uchwał dotyczących Miejscowych Planów Zagospodarowania Przestrzennego (MPZP) naruszających prawa własności.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Sprawy budowlane</span>
                            <span class="service-card__text">Wspieramy inwestorów oraz wykonawców w formalnym przejściu przez proces budowlany, eliminując ryzyko przestojów i kar.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Sprawy budowlane</h2>
                            <p class="service-modal__summary">Wspieramy inwestorów oraz wykonawców w formalnym przejściu przez proces budowlany, eliminując ryzyko przestojów i kar.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Pomoc w uzyskiwaniu pozwoleń na budowę, pozwoleń na użytkowanie oraz dokonywaniu formalnych zgłoszeń robót budowlanych.</li>
                                <li>Reprezentacja w postępowaniach przed Powiatowym i Wojewódzkim Inspektorem Nadzoru Budowlanego (PINB i WINB).</li>
                                <li>Prowadzenie spraw związanych z procedurą legalizacji samowoli budowlanych oraz nakazami rozbiórki obiektów.</li>
                                <li>Obrona w postępowaniach dotyczących nałożenia administracyjnych kar pieniężnych za naruszenie przepisów Prawa budowlanego.</li>
                            </ul>
                        </template>
                    </article>
                </div>
            </div>
        </section>

        <div class="service-modal" data-service-modal aria-hidden="true">
            <div class="service-modal__overlay" data-service-modal-close></div>
            <section class="service-modal__dialog" role="dialog" aria-modal="true" tabindex="-1" data-service-dialog>
                <button class="service-modal__close" type="button" data-service-modal-close aria-label="Zamknij">×</button>
                <div data-service-modal-body></div>
            </section>
        </div>
    </main>

    <div data-include="/partials/footer.html"></div>

    <script src="/js/main.js?v=20260829-4" defer></script>
    <script src="/js/services.js?v=20260829-4" defer></script>
</body>

</html>
