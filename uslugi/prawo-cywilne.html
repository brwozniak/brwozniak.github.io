        <section class="section section--hero">
            <div class="container services-page">
                <header class="services-page__header">
                    <h1 class="services-page__title">Prawo Cywilne</h1>
                    <p class="services-page__lead">Skomplikowane przepisy kodeksu cywilnego przekładamy na zrozumiały język i konkretne działania. Pomagamy chronić Twoje prawa majątkowe, osobiste oraz interesy biznesowe na każdym etapie sporu.</p>
                </header>


                <div class="service-cards" aria-label="Zakres usługi">

                        <button class="service-card__button" type="button" data-service-card>

                            <span class="service-card__text">Skutecznie pomagamy odzyskać należne Ci pieniądze lub obronić się przed bezprawnymi roszczeniami finansowymi.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Sprawy o zapłatę</h2>
                            <p class="service-modal__summary">Skutecznie pomagamy odzyskać należne Ci pieniądze lub obronić się przed bezprawnymi roszczeniami finansowymi.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Odzyskiwanie należności finansowych od dłużników.</li>
                                <li>Reprezentacja przed sądami wszystkich instancji.</li>
                                <li>Uzyskiwanie nakazów zapłaty w postępowaniu upominawczym.</li>
                                <li>Obrona przed nieuzasadnionymi żądaniami finansowymi.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Niewykonanie lub nienależyte wykonanie umowy</span>
                            <span class="service-card__text">Reprezentujemy interesy klientów, gdy druga strona kontraktu nie wywiązała się ze swoich zobowiązań lub zrobiła to niefachowo.</span>
                        </button>

                        <template data-service-detail>
                            <h2 class="service-modal__title">Niewykonanie lub nienależyte wykonanie umowy</h2>
                            <p class="service-modal__summary">Reprezentujemy interesy klientów, gdy druga strona kontraktu nie wywiązała się ze swoich zobowiązań lub zrobiła to niefachowo.</p>
                            <p class="service-modal__section-title">Zakres pomocy</p>
                            <ul class="service-modal__points">
                                <li>Dochodzenie odszkodowań za złamanie warunków kontraktu.</li>
                                <li>Egzekwowanie kar umownych i zadośćuczynień.</li>
                                <li>Rozwiązywanie sporów z nierzetelnymi kontrahentami.</li>
                                <li>Pomoc w sytuacjach, gdy usługa została wykonana wadliwie.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Wezwania do zapłaty</span>
                            <span class="service-card__text">Oficjalne wezwanie to kluczowy, pierwszy krok do polubownego zakończenia sporu finansowego bez udziału sądu.</span>
                        </button>

                                <li>Ocena szans na odzyskanie długu przed wejściem na drogę sądową.</li>
                                <li>Dyscyplinowanie partnerów biznesowych zwlekających z płatnościami.</li>
                            </ul>

                                <li>Konstruowanie zabezpieczeń finansowych i klauzul kar umownych.</li>
                                <li>Dostosowywanie treści dokumentów do aktualnych przepisów prawa.</li>
                            </ul>
                        </template>
                    </article>
                    <article class="service-card">
                        <button class="service-card__button" type="button" data-service-card>
                            <span class="service-card__title">Postępowanie egzekucyjne</span>
                            <span class="service-card__text">Wygrany wyrok to dopiero połowa sukcesu – skutecznie nadzorujemy proces faktycznego odzyskiwania Twoich pieniędzy.</span>

                            <ul class="service-modal__points">
                                <li>Ścisła współpraca z komornikami w celu odzyskania pieniędzy.</li>
                                <li>Poszukiwanie i ustalanie majątku ukrywanego przez dłużników.</li>
                                <li>Składanie wniosków egzekucyjnych i nadzór nad ich realizacją.</li>
                                <li>Skargi na czynności komornika i ochrona praw wierzyciela.</li>
